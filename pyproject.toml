[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "educational-context-rag"
version = "0.1.0"
description = "Reproducible S1 research pipeline for lightweight multi-granular retrieval over PDF and PowerPoint."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate>=1.2,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "pypdf>=6.0,<7",
  "python-pptx>=1.0,<2",
  "PyYAML>=6.0,<7",
  "reportlab>=4.2,<5",
  "scipy>=1.14,<2",
  "sentence-transformers>=3.4,<6",
  "tabulate>=0.9,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
edu-rag = "experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/ingestion",
  "src/structure",
  "src/chunking",
  "src/retrieval",
  "src/routing",
  "src/generation",
  "src/evaluation",
  "src/experiments",
  "src/storage",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
